<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нишевый театральный экспириенс / tyatr.ru</title>
    <style>
        /* Глубокий черный фон и шрифты в стиле Apple */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Шапка в стиле нишевого театра */
        .header {
            width: 100%;
            text-align: center;
            padding: 40px 20px 20px 20px;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #86868b;
            opacity: 0;
            animation: fadeIn 1.5s ease forwards;
        }

        /* Центральный контейнер для текста */
        .welcome-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }

        /* Стили печатного текста и курсора */
        .welcome-text {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-align: center;
            min-height: 160px; /* Чтобы верстка не прыгала при пустой строке */
            display: inline-block;
            position: relative;
        }

        /* Мигающий каретка-курсор в стиле терминала/смартфонов */
        .welcome-text::after {
            content: '|';
            position: relative;
            margin-left: 4px;
            color: #0071e3; /* Фирменный синий Apple цвет для курсора */
            animation: blink 0.7s infinite;
        }

        /* Контейнер для кнопок-ссылок */
        .container {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 20px 20px 60px 20px;
            width: 100%;
            max-width: 600px;
            opacity: 0;
            animation: fadeIn 1.5s ease 0.5s forwards;
        }

        /* Стильные кнопки */
        .btn {
            display: inline-block;
            text-decoration: none;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: -0.01em;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Анимации */
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Адаптивность под мобильные экраны */
        @media (max-width: 600px) {
            .welcome-text {
                font-size: 2rem;
                min-height: 100px;
            }
            .header {
                font-size: 0.75rem;
                padding-top: 30px;
            }
            .container {
                padding-bottom: 40px;
                gap: 10px;
            }
            .btn {
                padding: 10px 18px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        Нишевый театральный экспириенс
    </header>

    <div class="welcome-container">
        <h1 id="greeting" class="welcome-text"></h1>
    </div>

    <div class="container">
        <a href="laba.html" class="btn">Лаборатория</a>
        <a href="neiro_clown.html" class="btn">Обучение</a>
        <a href="menu/litera.html" class="btn">Литература</a>
        <a href="ded.html" class="btn">Корни</a>
    </div>

    <script>
        // Список фраз на 7 языках (Русский + 6 ваших вариантов)
        const greetings = [
            "Привет, это Телеграм театр!",         // Русский
            "Салам, тиде Телеграм театр!",        // Марийский (луговомар.)
            "Сәлам, бу Телеграм театр!",          // Татарский
            "Ӟечбуресь, та Телеграм театр!",       // Удмуртский
            "Здравейте, това е Телеграм театър!", // Болгарский
            "Salut, acesta este Teatrul Telegram!",// Молдавский / Румынский
            "Hallo, das ist Telegram Theater!"    // Немецкий
        ];

        const greetingElement = document.getElementById("greeting");
        
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;

        function typeEffect() {
            const currentFullText = greetings[wordIndex];
            
            if (isDeleting) {
                // Удаляем по одной букве
                greetingElement.textContent = currentFullText.substring(0, charIndex - 1);
                charIndex--;
            } else {
                // Печатаем по одной букве
                greetingElement.textContent = currentFullText.substring(0, charIndex + 1);
                charIndex++;
            }

            // Настройка скорости
            let typeSpeed = isDeleting ? 30 : 70; // Скорость стирания выше скорости печати

            // Если слово допечатано полностью
            if (!isDeleting && charIndex === currentFullText.length) {
                typeSpeed = 2200; // Пауза, чтобы пользователь успел прочитать текст
                isDeleting = true;
            } 
            // Если слово полностью стерто
            else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                wordIndex = (wordIndex + 1) % greetings.length; // Переход к следующему языку
                typeSpeed = 400; // Небольшая пауза перед началом новой строки
            }

            setTimeout(typeEffect, typeSpeed);
        }

        // Запуск эффекта после загрузки страницы
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(typeEffect, 500);
        });
    </script>

</body>
</html>
