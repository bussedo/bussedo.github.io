<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семейное Древо | Stammbaum</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            color: #2c3e50;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        header {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }
        .lang-btn {
            background: #ffffff;
            border: 1px solid #dcdde1;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .lang-btn.active {
            background: #34495e;
            color: white;
            border-color: #34495e;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: radial-gradient(circle, #eef1f4 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: auto;
        }
        #tree-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 3000px;
            height: 2000px;
            pointer-events: none;
            z-index: 1;
        }
        .card {
            background: linear-gradient(135deg, #e0eafc, #cfdef3); /* Красивый пастельный цветной фон */
            border-radius: 10px;
            padding: 14px;
            width: 250px; /* Немного расширил карточку под крупные имена */
            height: 115px;
            box-shadow: 0 5px 15px rgba(52, 73, 94, 0.15);
            border: 1px solid rgba(52, 73, 94, 0.1);
            position: absolute;
            cursor: move;
            z-index: 10;
            user-select: none;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: box-shadow 0.2s;
        }
        .card:hover { 
            box-shadow: 0 8px 20px rgba(52, 73, 94, 0.25); 
        }
        .card h3 { 
            margin: 0 0 5px 0; 
            font-size: 15px; /* Укрупненный шрифт для имен */
            font-weight: 700; 
            text-align: center; 
            color: #2c3e50; 
            line-height: 1.3;
        }
        .card .region { 
            margin: 0 0 4px 0; 
            font-size: 11px; 
            color: #4a6572; 
            text-align: center; 
            font-style: italic; 
        }
        .card .info { 
            margin: 0; 
            font-size: 11px; 
            color: #5c6b73; 
            text-align: center; 
            line-height: 1.2; 
        }
    </style>
</head>
<body>

    <header>
        <button class="lang-btn active" onclick="setLanguage('ru')">RU</button>
        <button class="lang-btn" onclick="setLanguage('de')">DE</button>
    </header>

    <div id="canvas-container">
        <canvas id="tree-canvas"></canvas>
    </div>

    <script src="data.js"></script>
    <script>
        let lang = 'ru';
        const container = document.getElementById('canvas-container');
        const canvas = document.getElementById('tree-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = 3000;
            canvas.height = 2000;
            drawLines();
        }

        function drawLines() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#34495e"; /* Более темный контрастный цвет линий */
            ctx.lineWidth = 2.5;

            treeData.persons.forEach(person => {
                if (person.parents && person.parents.length > 0) {
                    person.parents.forEach(parentId => {
                        const parent = treeData.persons.find(p => p.id === parentId);
                        if (parent) {
                            ctx.beginPath();
                            // Точка старта: середина НИЗА карточки ребенка (ширина 250px, высота 115px)
                            ctx.moveTo(person.x + 125, person.y + 115);
                            // Точка финиша: середина ВЕРХА карточки родителя
                            ctx.lineTo(parent.x + 125, parent.y);
                            ctx.stroke();
                        }
                    });
                }
            });
        }

        function renderTree() {
            document.querySelectorAll('.card').forEach(c => c.remove());

            treeData.persons.forEach(person => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.left = person.x + 'px';
                card.style.top = person.y + 'px';
                
                card.innerHTML = `
                    <h3>${person.name[lang]}</h3>
                    <div class="region">${person.region[lang]}</div>
                    <div class="info">${person.info[lang]}</div>
                `;

                card.addEventListener('mousedown', function(e) {
                    let shiftX = e.clientX - card.getBoundingClientRect().left;
                    let shiftY = e.clientY - card.getBoundingClientRect().top;

                    function moveAt(clientX, clientY) {
                        let newX = clientX - container.getBoundingClientRect().left - shiftX + container.scrollLeft;
                        let newY = clientY - container.getBoundingClientRect().top - shiftY + container.scrollTop;
                        
                        card.style.left = newX + 'px';
                        card.style.top = newY + 'px';
                        
                        person.x = newX;
                        person.y = newY;
                        drawLines();
                    }

                    function onMouseMove(e) { moveAt(e.clientX, e.clientY); }
                    document.addEventListener('mousemove', onMouseMove);

                    document.onmouseup = function() {
                        document.removeEventListener('mousemove', onMouseMove);
                        document.onmouseup = null;
                    };
                });

                card.ondragstart = function() { return false; };
                container.appendChild(card);
            });
            drawLines();
        }

        function setLanguage(newLang) {
            lang = newLang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            if(event && event.target && event.target.classList) event.target.classList.add('active');
            renderTree();
        }

        window.addEventListener('resize', resizeCanvas);
        window.onload = function() {
            resizeCanvas();
            renderTree();
        };
    </script>
</body>
</html>
