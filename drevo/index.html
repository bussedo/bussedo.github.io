<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Семейное Древо | Stammbaum</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f8; color: #2c3e50; margin: 0; padding: 0; overflow: hidden; height: 100vh; width: 100vw; touch-action: none; }
        header { position: fixed; top: 15px; left: 15px; z-index: 100; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; max-width: 95vw; }
        .btn { background: #ffffff; border: 1px solid #dcdde1; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.2s ease; font-size: 13px; }
        .btn.active { background: #34495e; color: white; border-color: #34495e; }
        .btn-bday { background: #9b59b6; color: white; border-color: #8e44ad; }
        .btn-bday:hover { background: #8e44ad; }
        
        #main-person-select { padding: 8px 12px; border-radius: 6px; border: 1px solid #dcdde1; font-weight: 600; font-family: inherit; color: #2c3e50; font-size: 13px; cursor: pointer; background-color: #ffffff; outline: none; max-width: 150px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
        
        #canvas-container { width: 100vw; height: 100vh; position: relative; background: radial-gradient(circle, #eef1f4 1px, transparent 1px); background-size: 20px 20px; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }
        #tree-canvas { position: absolute; top: 0; left: 0; width: 4000px; height: 3000px; pointer-events: none; z-index: 1; }
        
        .card { border-radius: 10px; padding: 14px; width: 250px; height: 115px; box-shadow: 0 5px 15px rgba(52, 73, 94, 0.15); position: absolute; cursor: move; z-index: 10; user-select: none; -webkit-user-select: none; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; transition: box-shadow 0.2s; touch-action: none; }
        
        .card.me { background: linear-gradient(135deg, #ffe259, #ffa751); border: 1px solid #ffa751; z-index: 15; box-shadow: 0 8px 20px rgba(255, 167, 81, 0.4); }
        .card.paternal { background: linear-gradient(135deg, #e0eafc, #cfdef3); border: 1px solid #b0c4de; }
        .card.maternal { background: linear-gradient(135deg, #fed6e3, #fbc2eb); border: 1px solid #fbc2eb; }
        .card.neutral { background: linear-gradient(135deg, #fdfbfb, #ebedee); border: 1px solid #dcdde1; }
        
        .card h3 { margin: 0 0 5px 0; font-size: 14px; font-weight: 700; text-align: center; color: #2c3e50; line-height: 1.3; padding-right: 20px; padding-left: 20px; }
        .card .region { margin: 0 0 4px 0; font-size: 11px; color: #4a6572; text-align: center; font-weight: 600; }
        .card .info { margin: 0; font-size: 11px; color: #5c6b73; text-align: center; line-height: 1.2; }
        
        .toggle-btn { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; background: rgba(0,0,0,0.05); border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center; color: #34495e; transition: background 0.2s; }
        .toggle-btn:hover { background: rgba(0,0,0,0.15); }
        
        #error-banner { display: none; position: fixed; top: 70px; left: 20px; background: #e74c3c; color: white; padding: 15px; border-radius: 6px; z-index: 999; font-weight: bold; max-width: 80%; }
        
        /* Стили для Календаря Дней Рождений */
        #bday-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 999; }
        #bday-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 1000; max-height: 80vh; overflow-y: auto; width: 320px; }
        #bday-modal h2 { margin-top: 0; font-size: 18px; text-align: center; color: #2c3e50; border-bottom: 2px solid #f4f6f8; padding-bottom: 10px; }
        .bday-item { padding: 10px 0; border-bottom: 1px solid #f4f6f8; font-size: 13px; color: #34495e; display: flex; align-items: center; }
        .bday-date { font-weight: bold; color: #e74c3c; width: 45px; flex-shrink: 0; }
        .bday-name { flex-grow: 1; margin-left: 10px; line-height: 1.3; }
        .bday-year { color: #95a5a6; font-size: 11px; }
        #bday-close { display: block; margin: 20px auto 0; background: #34495e; color: white; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <button class="btn active" id="btn-ru" onclick="setLanguage('ru')">RU</button>
        <button class="btn" id="btn-de" onclick="setLanguage('de')">DE</button>
        <select id="main-person-select" onchange="changeMainPerson(this.value)"></select>
        <button class="btn btn-bday" id="btn-bday" onclick="openBdays()">📅 Дни рождения</button>
        <button class="btn" onclick="resetPositions()" style="background: #e74c3c; color: white; border: none;">Сбросить позиции</button>
    </header>

    <div id="error-banner"></div>
    
    <div id="bday-overlay" onclick="closeBdays()"></div>
    <div id="bday-modal">
        <h2 id="bday-title">Дни рождения</h2>
        <div id="bday-list"></div>
        <button id="bday-close" onclick="closeBdays()">Закрыть</button>
    </div>

    <div id="canvas-container">
        <canvas id="tree-canvas"></canvas>
    </div>

    <script src="data.js"></script>
    <script>
        let lang = 'ru';
        let currentMain = 'me'; 
        
        const allowedMainIds = ['me', 'cousin_artem', 'martin', 'father_dmitry', 'mother_ekaterina', 'aunt_svetlana', 'uncle_konstantin', 'uncle_dmitry_e'];
        
        const container = document.getElementById('canvas-container');
        const canvas = document.getElementById('tree-canvas');
        const ctx = canvas.getContext('2d');
        const errorBanner = document.getElementById('error-banner');

        function resizeCanvas() {
            canvas.width = 4000; canvas.height = 3000; drawLines();
        }

        function populateDropdown() {
            const select = document.getElementById('main-person-select');
            select.innerHTML = '';
            
            if (typeof treeData === 'undefined' || !treeData.persons) return;
            
            let sortedPersons = treeData.persons
                .filter(p => allowedMainIds.includes(p.id))
                .sort((a, b) => a.n[lang].localeCompare(b.n[lang]));
            
            sortedPersons.forEach(p => {
                let opt = document.createElement('option');
                opt.value = p.id;
                opt.text = '👑 ' + p.n[lang];
                if (p.id === currentMain) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function openBdays() {
            const list = document.getElementById('bday-list');
            list.innerHTML = '';
            
            let birthdays = [];
            treeData.persons.forEach(p => {
                let info = p.i.ru;
                let match = info.match(/\b(\d{2})\.(\d{2})\.(\d{4})\b/);
                if (match) {
                    birthdays.push({
                        name: p.n[lang],
                        day: parseInt(match[1], 10),
                        month: parseInt(match[2], 10),
                        year: match[3]
                    });
                }
            });
            
            birthdays.sort((a, b) => {
                if (a.month !== b.month) return a.month - b.month;
                return a.day - b.day;
            });
            
            birthdays.forEach(b => {
                let dayStr = String(b.day).padStart(2, '0');
                let monthStr = String(b.month).padStart(2, '0');
                list.innerHTML += `<div class="bday-item">
                    <div class="bday-date">${dayStr}.${monthStr}</div>
                    <div class="bday-name">${b.name} <span class="bday-year">(${b.year})</span></div>
                </div>`;
            });
            
            document.getElementById('bday-title').innerText = lang === 'ru' ? 'Дни рождения' : 'Geburtstage';
            document.getElementById('bday-close').innerText = lang === 'ru' ? 'Закрыть' : 'Schließen';
            
            document.getElementById('bday-overlay').style.display = 'block';
            document.getElementById('bday-modal').style.display = 'block';
        }

        function closeBdays() {
            document.getElementById('bday-overlay').style.display = 'none';
            document.getElementById('bday-modal').style.display = 'none';
        }

        let visibleNodes = {};
        function calculateVisibility() {
            visibleNodes = {};
            let childrenOf = {};
            treeData.persons.forEach(p => childrenOf[p.id] = []);
            treeData.persons.forEach(p => {
                if (p.p) {
                    p.p.forEach(parentId => {
                        if (childrenOf[parentId]) childrenOf[parentId].push(p.id);
                    });
                }
            });

            let queue = [currentMain];
            visibleNodes[currentMain] = true;

            let head = 0;
            while (head < queue.length) {
                let currId = queue[head++];
                let node = treeData.persons.find(p => p.id === currId);
                if (!node) continue;

                if (!node.h && node.p) {
                    node.p.forEach(parentId => {
                        if (!visibleNodes[parentId]) {
                            visibleNodes[parentId] = true;
                            queue.push(parentId);
                        }
                    });
                }

                if (childrenOf[currId]) {
                    childrenOf[currId].forEach(childId => {
                        if (!visibleNodes[childId]) {
                            visibleNodes[childId] = true;
                            queue.push(childId);
                        }
                    });
                }
            }
        }

        let nodeColors = {};
        function calculateColors() {
            treeData.persons.forEach(p => nodeColors[p.id] = 'neutral'); 
            nodeColors[currentMain] = 'me';
            
            let mainNode = treeData.persons.find(p => p.id === currentMain);
            if (mainNode && mainNode.p) {
                if (mainNode.p.length >= 1) {
                    let fatherId = mainNode.p[0];
                    let qFather = [fatherId];
                    while(qFather.length > 0) {
                        let id = qFather.shift();
                        nodeColors[id] = 'paternal';
                        let n = treeData.persons.find(p => p.id === id);
                        if (n && n.p) qFather.push(...n.p);
                    }
                }
                if (mainNode.p.length >= 2) {
                    let motherId = mainNode.p[1];
                    let qMother = [motherId];
                    while(qMother.length > 0) {
                        let id = qMother.shift();
                        nodeColors[id] = 'maternal';
                        let n = treeData.persons.find(p => p.id === id);
                        if (n && n.p) qMother.push(...n.p);
                    }
                }
            }
        }

        function getKinship(mainId, targetId) {
            if (mainId === targetId) return lang === 'ru' ? "Это Вы" : "Das bist du";
            
            let getAncestors = (startId) => {
                let distances = { [startId]: 0 };
                let queue = [startId];
                while(queue.length > 0) {
                    let curr = queue.shift();
                    let node = treeData.persons.find(p => p.id === curr);
                    if (node && node.p) {
                        node.p.forEach(parentId => {
                            if (distances[parentId] === undefined) {
                                distances[parentId] = distances[curr] + 1;
                                queue.push(parentId);
                            }
                        });
                    }
                }
                return distances;
            };

            let mainAncestors = getAncestors(mainId);
            let targetAncestors = getAncestors(targetId);
            
            let minDistance = Infinity;
            let bestUp = -1;
            let bestDown = -1;
            
            for (let ancestor in mainAncestors) {
                if (targetAncestors[ancestor] !== undefined) {
                    let up = mainAncestors[ancestor];
                    let down = targetAncestors[ancestor];
                    if (up + down < minDistance) {
                        minDistance = up + down;
                        bestUp = up;
                        bestDown = down;
                    }
                }
            }
            
            let targetNode = treeData.persons.find(p => p.id === targetId);
            let name = targetNode.n.ru.split(' ')[0];
            let isFemale = /(а|я|ия)$/i.test(name) && !/Никита|Илья|Лука|Фома|Савва/i.test(name);

            if (bestUp === -1) {
                let isSpouse = treeData.persons.some(p => p.p && p.p.includes(mainId) && p.p.includes(targetId));
                if (isSpouse) {
                    return lang === 'ru' ? (isFemale ? 'Жена' : 'Муж') : (isFemale ? 'Ehefrau' : 'Ehemann');
                }
                return null;
            }

            let relRu = ""; let relDe = "";
            if (bestUp === 1 && bestDown === 0) { relRu = isFemale ? "Мать" : "Отец"; relDe = isFemale ? "Mutter" : "Vater"; }
            else if (bestUp === 2 && bestDown === 0) { relRu = isFemale ? "Бабушка" : "Дедушка"; relDe = isFemale ? "Großmutter" : "Großvater"; }
            else if (bestUp === 3 && bestDown === 0) { relRu = isFemale ? "Прабабушка" : "Прадед"; relDe = isFemale ? "Urgroßmutter" : "Urgroßvater"; }
            else if (bestUp === 4 && bestDown === 0) { relRu = isFemale ? "Прапрабабушка" : "Прапрадед"; relDe = isFemale ? "Ururgroßmutter" : "Ururgroßvater"; }
            else if (bestUp === 5 && bestDown === 0) { relRu = isFemale ? "Прапрапрабабушка (Пращурка)" : "Прапрапрадед (Пращур)"; relDe = isFemale ? "Urururgroßmutter (Altgroßmutter)" : "Urururgroßvater (Altgroßvater)"; }
            else if (bestUp > 5 && bestDown === 0) { 
                let praCount = bestUp - 2;
                let prefixRu = "Пра" + "пра".repeat(praCount - 1);
                let prefixDe = "Ur" + "ur".repeat(praCount - 1);
                relRu = isFemale ? prefixRu + "бабушка" : prefixRu + "дед";
                relDe = isFemale ? prefixDe + "großmutter" : prefixDe + "großvater";
            }
            else if (bestUp === 0 && bestDown === 1) { relRu = isFemale ? "Дочь" : "Сын"; relDe = isFemale ? "Tochter" : "Sohn"; }
            else if (bestUp === 0 && bestDown === 2) { relRu = isFemale ? "Внучка" : "Внук"; relDe = isFemale ? "Enkelin" : "Enkel"; }
            else if (bestUp === 1 && bestDown === 1) { relRu = isFemale ? "Сестра" : "Брат"; relDe = isFemale ? "Schwester" : "Bruder"; }
            else if (bestUp === 2 && bestDown === 1) { relRu = isFemale ? "Тетя" : "Дядя"; relDe = isFemale ? "Tante" : "Onkel"; }
            else if (bestUp === 3 && bestDown === 1) { relRu = isFemale ? "Двоюродная бабушка" : "Двоюродный дедушка"; relDe = isFemale ? "Großtante" : "Großonkel"; }
            else if (bestUp === 1 && bestDown === 2) { relRu = isFemale ? "Племянница" : "Племянник"; relDe = isFemale ? "Nichte" : "Neffe"; }
            else if (bestUp === 2 && bestDown === 2) { relRu = isFemale ? "Двоюродная сестра" : "Двоюродный брат"; relDe = isFemale ? "Cousine" : "Cousin"; }
            else if (bestUp === 2 && bestDown === 3) { relRu = isFemale ? "Двоюродная племянница" : "Двоюродный племянник"; relDe = isFemale ? "Nichte 2. Grades" : "Neffe 2. Grades"; }
            else if (bestUp === 3 && bestDown === 2) { relRu = isFemale ? "Двоюродная тетя" : "Двоюродный дядя"; relDe = isFemale ? "Tante 2. Grades" : "Onkel 2. Grades"; }
            else { relRu = "Родственник"; relDe = "Verwandter"; }

            return lang === 'ru' ? relRu : relDe;
        }

        function isPersonHidden(id) { return !visibleNodes[id]; }

        function drawLines() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#34495e"; ctx.lineWidth = 2.5;

            treeData.persons.forEach(person => {
                if (isPersonHidden(person.id)) return; 
                if (person.p && person.p.length > 0 && !person.h) {
                    person.p.forEach(parentId => {
                        if (isPersonHidden(parentId)) return;
                        const parent = treeData.persons.find(p => p.id === parentId);
                        if (parent) {
                            ctx.beginPath();
                            ctx.moveTo(person.x + 125, person.y + 115);
                            ctx.lineTo(parent.x + 125, parent.y);
                            ctx.stroke();
                        }
                    });
                }
            });
        }

        function toggleBranch(id, event) {
            event.stopPropagation();
            let person = treeData.persons.find(p => p.id === id);
            if (person) {
                person.h = !person.h;
                const collapsed = JSON.parse(localStorage.getItem('tree_collapsed') || '{}');
                collapsed[id] = person.h;
                localStorage.setItem('tree_collapsed', JSON.stringify(collapsed));
                renderTree();
            }
        }

        function changeMainPerson(newMainId) {
            currentMain = newMainId;
            treeData.persons.forEach(p => p.h = true);
            localStorage.removeItem('tree_collapsed');
            renderTree();
            
            setTimeout(() => {
                let mainPersonNode = treeData.persons.find(p => p.id === currentMain);
                if (mainPersonNode) {
                    container.scrollLeft = mainPersonNode.x - (window.innerWidth / 2) + 125;
                    container.scrollTop = mainPersonNode.y - (window.innerHeight / 2) + 57;
                }
            }, 100);
        }

        function renderTree() {
            calculateVisibility();
            calculateColors();
            document.querySelectorAll('.card').forEach(c => c.remove());

            treeData.persons.forEach(person => {
                if (isPersonHidden(person.id)) return; 

                const card = document.createElement('div');
                card.className = `card ${nodeColors[person.id]}`;
                card.style.left = person.x + 'px'; card.style.top = person.y + 'px';
                
                let toggleBtnHtml = '';
                if (person.p && person.p.length > 0) {
                    toggleBtnHtml = `<button class="toggle-btn" onclick="toggleBranch('${person.id}', event)">${person.h ? '+' : '−'}</button>`;
                }
                
                let originalInfo = person.i[lang];
                let bio = "";
                
                if (originalInfo.includes(' • ')) {
                    bio = originalInfo.split(' • ').slice(1).join(' • ');
                } else {
                    bio = originalInfo.replace(/^((Пра)+дед|(Пра)+бабушка|Пра\(\d+\)дед|Пра\(\d+\)бабушка|Дед|Бабушка|Брат|Сестра|Дядя|Тетя|Отец|Мать|Сын|Дочь|Внук|Внучка|Создатель древа|Создатель|Муж|Жена|Двоюродный племянник|Двоюродная племянница|Двоюродный дядя|Двоюродная тетя)\s*•?\s*/i, '').trim();
                }
                
                let dynamicRel = getKinship(currentMain, person.id);
                let displayInfo = originalInfo; 
                
                if (dynamicRel) {
                    displayInfo = bio ? `${dynamicRel} • ${bio}` : dynamicRel;
                } else {
                    displayInfo = bio;
                }
                
                card.innerHTML = `
                    ${toggleBtnHtml}
                    <h3>${person.n[lang]}</h3>
                    <div class="region">${person.r[lang]}</div>
                    <div class="info">${displayInfo}</div>
                `;

                function startDrag(e) {
                    if (e.target.className === 'toggle-btn') return;
                    
                    let clientX = e.clientX || (e.touches && e.touches[0].clientX);
                    let clientY = e.clientY || (e.touches && e.touches[0].clientY);
                    if (clientX === undefined) return;
                    
                    let shiftX = clientX - card.getBoundingClientRect().left;
                    let shiftY = clientY - card.getBoundingClientRect().top;

                    function moveAt(pageX, pageY) {
                        let newX = pageX - container.getBoundingClientRect().left - shiftX + container.scrollLeft;
                        let newY = pageY - container.getBoundingClientRect().top - shiftY + container.scrollTop;
                        card.style.left = newX + 'px'; card.style.top = newY + 'px';
                        person.x = newX; person.y = newY;
                        drawLines();
                    }

                    function onMove(evt) { 
                        evt.preventDefault(); 
                        let px = evt.clientX || (evt.touches && evt.touches[0].clientX);
                        let py = evt.clientY || (evt.touches && evt.touches[0].clientY);
                        if (px !== undefined) moveAt(px, py); 
                    }
                    
                    function onEnd() {
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onEnd);
                        document.removeEventListener('touchmove', onMove);
                        document.removeEventListener('touchend', onEnd);
                        
                        const positions = JSON.parse(localStorage.getItem('tree_positions') || '{}');
                        positions[person.id] = { x: person.x, y: person.y };
                        localStorage.setItem('tree_positions', JSON.stringify(positions));
                    }

                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onEnd);
                    document.addEventListener('touchmove', onMove, {passive: false});
                    document.addEventListener('touchend', onEnd);
                }

                card.addEventListener('mousedown', startDrag);
                card.addEventListener('touchstart', startDrag, {passive: false});
                card.ondragstart = function() { return false; };

                container.appendChild(card);
            });
            drawLines();
        }

        function setLanguage(newLang) {
            lang = newLang;
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${newLang}`).classList.add('active');
            document.getElementById('btn-bday').innerText = lang === 'ru' ? '📅 Дни рождения' : '📅 Geburtstage';
            populateDropdown();
            renderTree();
        }

        function resetPositions() {
            if(confirm("Сбросить все карточки в исходное положение?")) {
                localStorage.removeItem('tree_positions');
                localStorage.removeItem('tree_collapsed');
                location.reload();
            }
        }

        window.addEventListener('resize', resizeCanvas);
        window.onload = function() { 
            try {
                if (typeof treeData === 'undefined') {
                    throw new Error("Файл data.js не найден.");
                }
                
                const savedPositions = JSON.parse(localStorage.getItem('tree_positions') || 'null');
                if (savedPositions) {
                    treeData.persons.forEach(p => {
                        if (savedPositions[p.id]) { p.x = savedPositions[p.id].x; p.y = savedPositions[p.id].y; }
                    });
                }
                
                const savedCollapsed = JSON.parse(localStorage.getItem('tree_collapsed') || 'null');
                if (savedCollapsed) {
                    treeData.persons.forEach(p => {
                        if (savedCollapsed[p.id] !== undefined) p.h = savedCollapsed[p.id];
                    });
                } else {
                    treeData.persons.forEach(p => p.h = true);
                }

                populateDropdown();
                resizeCanvas(); 
                renderTree(); 
                
                setTimeout(() => {
                    let mainPersonNode = treeData.persons.find(p => p.id === currentMain);
                    if (mainPersonNode) {
                        container.scrollLeft = mainPersonNode.x - (window.innerWidth / 2) + 125;
                        container.scrollTop = mainPersonNode.y - (window.innerHeight / 2) + 57;
                    }
                }, 150);
                
            } catch (err) {
                errorBanner.style.display = 'block';
                errorBanner.innerText = `КРИТИЧЕСКАЯ ОШИБКА: ${err.message}`;
            }
        };
    </script>
</body>
</html>
