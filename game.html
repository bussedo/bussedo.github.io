<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>КИШИБЕ И КЕЩЕК БАДЖЕТ</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #c084fc;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      text-align: center;
      padding: 4px 0;
    }

    header h1 {
      font-size: 1.25rem;
      color: var(--accent);
      margin-bottom: 2px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    header p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .sync-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .countdown-card {
      background: rgba(56, 189, 248, 0.08);
      border: 1px dashed var(--accent);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }

    .countdown-timer {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 1.5px;
      font-variant-numeric: tabular-nums;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid var(--border);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-box {
      background: rgba(15, 23, 42, 0.6);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-val {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-val.target { color: var(--accent); }
    .stat-val.yandex { color: var(--purple); }
    .stat-val.fun { color: var(--warning); }
    .stat-val.bank { color: var(--success); }

    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.2;
    }

    .today-meter {
      margin-top: 12px;
      background: rgba(15, 23, 42, 0.4);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .progress-bar-bg {
      background: var(--border);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      background: var(--success);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 10px;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    input[type="number"], input[type="text"], select {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border: none;
      padding: 11px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
    }

    .tx-item:last-child {
      border-bottom: none;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 600;
    }

    .badge-food { background: rgba(56, 189, 248, 0.2); color: var(--accent); }
    .badge-cats { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .badge-fun { background: rgba(192, 132, 252, 0.2); color: var(--purple); }
    .badge-other { background: rgba(148, 163, 184, 0.2); color: var(--text-muted); }

    .del-btn {
      background: transparent;
      color: var(--danger);
      padding: 2px 6px;
      font-size: 0.75rem;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 4px;
      cursor: pointer;
      margin-left: 8px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>Кишибе спринт 🎯</h1>
    <p>Режим накопления: 450 ₽/день (до 23 октября)</p>
    <div class="sync-status" id="cloud-status">Подключение к облаку...</div>
  </header>

  <div class="countdown-card">
    <div style="font-size: 0.72rem; color: var(--text-muted); margin-bottom: 2px;">
      До закрытия суток:
    </div>
    <div class="countdown-timer" id="countdown">--:--:--</div>
  </div>

  <!-- 4 окна: без опыта, только деньги -->
  <div class="card">
    <div class="dashboard-grid">
      <div class="stat-box">
        <div class="stat-val target" id="saved-target-val">+1 000 ₽</div>
        <div class="stat-label">🎯 План подушки (при 450 ₽/д)</div>
      </div>
      <div class="stat-box">
        <div class="stat-val bank" id="bank-val">0 ₽</div>
        <div class="stat-label">Сэкономлено от 450 ₽</div>
      </div>
      <div class="stat-box">
        <div class="stat-val yandex" id="yandex-val">14 688 ₽</div>
        <div class="stat-label" id="yandex-sub">Свободно: 4 688 ₽</div>
      </div>
      <div class="stat-box">
        <div class="stat-val fun" id="fun-val">500 ₽</div>
        <div class="stat-label">Кофе / Приколы</div>
      </div>
    </div>

    <!-- Индикатор текущего дня -->
    <div class="today-meter">
      <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
        <span>Еда за <span id="active-day-label">18.10</span>:</span>
        <span id="today-spent-label"><b>0 ₽</b> / 450 ₽</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="today-progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- Форма внесения чека -->
  <div class="card">
    <h2 style="font-size: 0.95rem; margin-bottom: 10px; color: var(--accent);">Внести чек / операцию</h2>
    
    <div class="form-group">
      <label for="day-select">День спринта:</label>
      <select id="day-select" onchange="render()">
        <option value="17.10">17 октября (Сб)</option>
        <option value="18.10" selected>18 октября (Вс)</option>
        <option value="19.10">19 октября (Пн)</option>
        <option value="20.10">20 октября (Вт)</option>
        <option value="21.10">21 октября (Ср)</option>
        <option value="22.10">22 октября (Чт)</option>
        <option value="23.10">23 октября (Пт — финиш)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="category-select">Категория списания:</label>
      <select id="category-select">
        <option value="food">🍽 Еда дома / продукты (из лимита 450 ₽)</option>
        <option value="fun">☕ Кофе / Приколы (из фонда 500 ₽)</option>
        <option value="cats">🐱 Кошки (паучи / наполнитель)</option>
        <option value="other">🚌 Аптека / Проезд / Прочее</option>
      </select>
    </div>

    <div class="form-group">
      <label for="amount-input">Сумма (₽):</label>
      <input type="number" id="amount-input" placeholder="Например: 250" min="0" />
    </div>

    <div class="form-group">
      <label for="desc-input">Описание (что куплено):</label>
      <input type="text" id="desc-input" placeholder="Например: Гречка, яйца, хлеб" />
    </div>

    <button id="save-btn" onclick="addExpense()" style="width: 100%;">Записать чек</button>
  </div>

  <!-- Журнал расходов -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h2 style="font-size: 0.95rem; color: var(--accent);">Журнал расходов</h2>
      <button onclick="loadDataFromCloud()" style="padding: 4px 8px; font-size: 0.75rem; background: transparent; border: 1px solid var(--border); color: var(--text-muted);">🔄</button>
    </div>
    <div id="tx-list"></div>
  </div>
</div>

<script>
  const BIN_ID = "6acffa28ac6210605a321908";
  const API_KEY = "\$2a\$10\$Gxs0gCaDe/F93Ls1ECP8eOP7USSJ2G6MkTjafbN5TESoS19C8CMTS";
  const DAILY_FOOD_LIMIT = 450; // Эконом-лимит
  const BASELINE_FOOD_LIMIT = 650; // Старый комфортный лимит
  const INITIAL_FUN_BUDGET = 500;
  const TABLET_RESERVE = 10000;
  // Базовый остаток на Яндекс Сейфе («Кубышка») на вечер 18 октября
  const BASE_YANDEX_TOTAL = 14688;

  let state = {
    transactions: []
  };

  function updateCountdown() {
    const now = new Date();
    const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
    const diff = endOfDay - now;

    if (diff <= 0) {
      document.getElementById("countdown").innerText = "00:00:00";
      return;
    }

    const hours = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, "0");
    const minutes = String(Math.floor((diff / (1000 * 60)) % 60)).padStart(2, "0");
    const seconds = String(Math.floor((diff / 1000) % 60)).padStart(2, "0");

    document.getElementById("countdown").innerText = `${hours}:${minutes}:${seconds}`;
  }
  setInterval(updateCountdown, 1000);
  updateCountdown();

  async function loadDataFromCloud() {
    const statusEl = document.getElementById("cloud-status");
    statusEl.innerText = "Синхронизация...";
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": API_KEY }
      });
      if (res.ok) {
        const data = await res.json();
        if (data.record && Array.isArray(data.record.transactions)) {
          state = data.record;
        }
        statusEl.innerText = "🟢 Облако синхронизировано";
      } else {
        statusEl.innerText = "Офлайн-режим";
      }
    } catch (e) {
      statusEl.innerText = "Сбой сети";
    }
    render();
  }

  async function syncToCloud() {
    const statusEl = document.getElementById("cloud-status");
    const saveBtn = document.getElementById("save-btn");
    statusEl.innerText = "Сохранение...";
    saveBtn.disabled = true;

    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": API_KEY
        },
        body: JSON.stringify(state)
      });
      if (res.ok) {
        statusEl.innerText = "🟢 Данные сохранены!";
      } else {
        statusEl.innerText = "Ошибка записи";
      }
    } catch (e) {
      statusEl.innerText = "Ошибка подключения";
    }
    saveBtn.disabled = false;
    render();
  }

  function calculateDashboard() {
    let bankOfFreedom = 0;
    const days = ["18.10", "19.10", "20.10", "21.10", "22.10", "23.10"];

    days.forEach(d => {
      const dayFoodTxs = (state.transactions || []).filter(t => t.day === d && t.category === "food");
      const totalFood = dayFoodTxs.reduce((sum, t) => sum + t.amount, 0);

      if (dayFoodTxs.length > 0) {
        bankOfFreedom += (DAILY_FOOD_LIMIT - totalFood);
      }
    });

    // Расход на приколы из фонда 500 ₽
    const spentOnFun = (state.transactions || [])
      .filter(t => t.category === "fun" && t.day >= "18.10")
      .reduce((sum, t) => sum + t.amount, 0);
    const funRemaining = Math.max(0, INITIAL_FUN_BUDGET - spentOnFun);

    // Вычитание ВСЕХ расходов за 18.10 и далее из Яндекс Сейфа
    const newExpenses = (state.transactions || [])
      .filter(t => t.day >= "18.10")
      .reduce((sum, t) => sum + t.amount, 0);

    const actualYandexTotal = Math.max(0, BASE_YANDEX_TOTAL - newExpenses);
    const freeYandexReserve = Math.max(0, actualYandexTotal - TABLET_RESERVE);

    // Сохраняемый фонд: 200 ₽ разницы в день за оставшиеся 5 дней спринта
    const targetSavings = (BASELINE_FOOD_LIMIT - DAILY_FOOD_LIMIT) * 5;

    return {
      targetSavings,
      bankOfFreedom: Math.max(0, bankOfFreedom),
      yandexTotal: actualYandexTotal,
      freeReserve: freeYandexReserve,
      funRemaining
    };
  }

  async function addExpense() {
    const day = document.getElementById("day-select").value;
    const category = document.getElementById("category-select").value;
    const amount = parseFloat(document.getElementById("amount-input").value);
    const desc = document.getElementById("desc-input").value.trim() || "Без описания";

    if (isNaN(amount) || amount <= 0) {
      alert("Введите корректную сумму чека!");
      return;
    }

    if (!Array.isArray(state.transactions)) state.transactions = [];

    state.transactions.push({
      id: Date.now(),
      day,
      category,
      amount,
      desc
    });

    document.getElementById("amount-input").value = "";
    document.getElementById("desc-input").value = "";

    await syncToCloud();
  }

  async function deleteTx(id) {
    state.transactions = state.transactions.filter(t => t.id !== id);
    await syncToCloud();
  }

  function render() {
    const activeDay = document.getElementById("day-select").value;
    document.getElementById("active-day-label").innerText = activeDay;

    const dayFoodTotal = (state.transactions || [])
      .filter(t => t.day === activeDay && t.category === "food")
      .reduce((sum, t) => sum + t.amount, 0);

    document.getElementById("today-spent-label").innerHTML = `<b>${dayFoodTotal} ₽</b> / ${DAILY_FOOD_LIMIT} ₽`;

    const percent = Math.min(100, (dayFoodTotal / DAILY_FOOD_LIMIT) * 100);
    const bar = document.getElementById("today-progress-bar");
    bar.style.width = `${percent}%`;
    bar.style.backgroundColor = dayFoodTotal > DAILY_FOOD_LIMIT ? "var(--danger)" : (dayFoodTotal > 350 ? "var(--warning)" : "var(--success)");

    const data = calculateDashboard();
    document.getElementById("saved-target-val").innerText = `+${data.targetSavings} ₽`;
    document.getElementById("bank-val").innerText = `${data.bankOfFreedom} ₽`;
    document.getElementById("yandex-val").innerText = `${data.yandexTotal.toLocaleString('ru-RU')} ₽`;
    document.getElementById("yandex-sub").innerText = `Свободно: ${data.freeReserve.toLocaleString('ru-RU')} ₽`;
    document.getElementById("fun-val").innerText = `${data.funRemaining.toLocaleString('ru-RU')} ₽`;

    const txListEl = document.getElementById("tx-list");
    txListEl.innerHTML = "";

    if (!state.transactions || state.transactions.length === 0) {
      txListEl.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 12px;">Пока нет записей.</div>`;
      return;
    }

    state.transactions.slice().reverse().forEach(t => {
      const row = document.createElement("div");
      row.className = "tx-item";

      let catBadge = `<span class="badge badge-food">Еда</span>`;
      if (t.category === "cats") catBadge = `<span class="badge badge-cats">Кошки</span>`;
      if (t.category === "fun") catBadge = `<span class="badge badge-fun">Приколы</span>`;
      if (t.category === "other") catBadge = `<span class="badge badge-other">Аптека/Прочее</span>`;

      row.innerHTML = `
        <div>
          <div><b>${t.amount} ₽</b> ${catBadge} <span style="color: var(--text-muted); font-size: 0.75rem;">(${t.day})</span></div>
          <div style="font-size: 0.8rem; color: var(--text-muted);">${t.desc}</div>
        </div>
        <div>
          <button class="del-btn" onclick="deleteTx(${t.id})">✕</button>
        </div>
      `;
      txListEl.appendChild(row);
    });
  }

  loadDataFromCloud();
</script>
</body>
</html>
